# Local development stack: API + web client.
#
# Previously referenced two Dockerfiles that did not exist, so `docker compose
# build` failed on the first step. Also set AI_PROVIDER=mock, which is not a
# supported provider — update_config now rejects it, and the server would have
# fallen through to local_llm regardless.

services:
  core:
    build:
      context: ./services/core
      dockerfile: Dockerfile
    # Bind the published port to loopback only. FRIDAY exposes OS-control
    # endpoints; publishing on 0.0.0.0 would offer them to the whole LAN.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # HOST is the bind inside the container; the mapping above controls host
      # exposure.
      - HOST=0.0.0.0
      - PORT=8000
      - AI_PROVIDER=local_llm
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite+aiosqlite:////data/friday.db
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      # Generated on first run and written to the token volume; native clients
      # read it from there. Override to pin a known value.
      - FRIDAY_TOKEN_FILE=/data/api_token
    volumes:
      - friday-data:/data
    restart: unless-stopped

  desktop:
    build:
      context: ./apps/desktop
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      core:
        condition: service_healthy
    restart: unless-stopped

volumes:
  friday-data:
