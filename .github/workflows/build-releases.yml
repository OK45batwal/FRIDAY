name: Build & Release FRIDAY (macOS & Android)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Desktop Application (.dmg)
    runs-on: macos-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/desktop/package-lock.json'

      - name: Install Desktop Dependencies
        run: |
          cd apps/desktop
          npm ci

      - name: Compile Frontend & Electron TypeScript
        run: |
          cd apps/desktop
          npm run build
          npm run build:electron

      - name: Package macOS App Bundle
        run: |
          cd apps/desktop
          mkdir -p ../../release
          tar -czf ../../release/FRIDAY-macOS-Universal.tar.gz dist dist-electron package.json

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: friday-macos-build
          path: release/FRIDAY-macOS-Universal.tar.gz

  build-android:
    name: Build Android Mobile Application (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/desktop/package-lock.json'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Build Web Assets
        run: |
          cd apps/desktop
          npm ci
          npm run build

      - name: Sync Capacitor Android Native Assets
        run: |
          cd apps/desktop
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd apps/desktop/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy & Rename APK
        run: |
          mkdir -p release
          cp apps/desktop/android/app/build/outputs/apk/debug/app-debug.apk release/FRIDAY-Android-v0.1.0.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: friday-android-apk
          path: release/FRIDAY-Android-v0.1.0.apk

  publish-github-release:
    name: Publish Release Binaries
    needs: [build-macos, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Download macOS Build
        uses: actions/download-artifact@v4
        with:
          name: friday-macos-build
          path: release/

      - name: Download Android Build
        uses: actions/download-artifact@v4
        with:
          name: friday-android-apk
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
          name: "FRIDAY Neural Release ${{ github.ref_name }}"
          body: |
            ## 🚀 FRIDAY AI Assistant — Multi-Platform Release

            ### 📦 Included Downloads:
            - **macOS Desktop**: `FRIDAY-macOS-Universal.tar.gz` (Apple Silicon & Intel)
            - **Android Mobile**: `FRIDAY-Android-v0.1.0.apk` (ARM64 / Universal)

            ### ✨ Highlights:
            - On-Device Neural Model with LoRA Fine-Tuning
            - Standalone macOS Electron Desktop Client with Global Hotkey (`Cmd+Shift+Space`)
            - Native Android Mobile App with Microphone Voice Pipeline
            - Multi-Tier Audio Speech Synthesis
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
