name: Build & Release FRIDAY (macOS & Android)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Typecheck, Test & Import Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/desktop/package-lock.json'

      - name: Install Desktop Dependencies
        run: npm ci
        working-directory: apps/desktop

      # Nothing gated the release on the code actually compiling or the tests
      # passing, so a broken build could be published.
      - name: Typecheck Frontend
        run: npx tsc --noEmit
        working-directory: apps/desktop

      - name: Typecheck Electron
        run: npx tsc -p tsconfig.electron.json --noEmit
        working-directory: apps/desktop

      - name: Run Frontend Tests
        run: npm test
        working-directory: apps/desktop

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Core Requirements
        run: pip install -r services/core/requirements.txt

      - name: Verify Backend Imports
        run: python -c "import services.core.app.main; print('backend imports OK')"
        env:
          PYTHONPATH: .

      - name: Run Backend Self-Checks
        run: |
          python services/core/core/storage.py
          python services/core/core/voice/text_to_speech.py
          python services/core/api/websocket/protocol.py
        env:
          PYTHONPATH: .

  build-macos:
    name: Build macOS Desktop Application (.dmg)
    runs-on: macos-latest
    needs: [verify]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/desktop/package-lock.json'

      - name: Install Desktop Dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Compile Frontend & Electron TypeScript
        run: |
          npm run build
          npm run build:electron
        working-directory: apps/desktop

      # This job is named ".dmg" but only ever tar'd up the raw build output —
      # electron-builder was never invoked, so no installable app was produced
      # and `dist:mac` went untested in CI. Build the real artifact.
      - name: Package macOS App with electron-builder
        run: npx electron-builder --mac --publish never
        working-directory: apps/desktop
        env:
          # Unsigned build: no certificate is available in CI. The output is
          # installable but Gatekeeper will warn until signing is configured.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List Built Artifacts
        run: ls -la release/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: friday-macos-build
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  build-android:
    name: Build Android Mobile Application (.apk)
    runs-on: ubuntu-latest
    needs: [verify]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/desktop/package-lock.json'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Build Web Assets
        run: |
          npm ci
          npm run build
        working-directory: apps/desktop

      - name: Sync Capacitor Android Native Assets
        run: npx cap sync android
        working-directory: apps/desktop

      - name: Build Android Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
        working-directory: apps/desktop/android

      - name: Copy & Rename APK
        run: |
          mkdir -p release
          cp apps/desktop/android/app/build/outputs/apk/debug/app-debug.apk release/FRIDAY-Android-v0.1.0.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: friday-android-apk
          path: release/FRIDAY-Android-v0.1.0.apk
          if-no-files-found: error

  publish-github-release:
    name: Publish Release Binaries
    needs: [build-macos, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Download macOS Build
        uses: actions/download-artifact@v4
        with:
          name: friday-macos-build
          path: release/

      - name: Download Android Build
        uses: actions/download-artifact@v4
        with:
          name: friday-android-apk
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
          name: "FRIDAY Neural Release ${{ github.ref_name }}"
          body: |
            ## FRIDAY AI Assistant — Multi-Platform Release

            ### Included Downloads
            - **macOS Desktop**: `.dmg` / `.zip` (unsigned — Gatekeeper will warn on first open)
            - **Android Mobile**: `FRIDAY-Android-v0.1.0.apk` (debug build)

            ### Notes
            - The desktop client talks to a locally-run FRIDAY Core API on
              `127.0.0.1:8000` and authenticates with the token the server writes
              to `~/.friday/api_token`.
            - Android builds are unsigned debug APKs and are not Play-Store ready.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
